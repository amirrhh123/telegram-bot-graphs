[project]
name = "telegram-bot-graphs"
version = "0.1.0"
description = "Telegram bot for dollar and euro price charts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8,<4",
    "Flask>=3.0,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyTelegramBotAPI>=4.14,<5",
    "requests>=2.31,<3",
    "tzdata>=2024.1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "main:app"
